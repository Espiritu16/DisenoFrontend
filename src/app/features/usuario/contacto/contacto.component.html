<div class="contact-page">
  <app-aqua-header
    reportHref="/reportar"
    reportsHref="/mis-reportes"
    contactHref="/contacto"
    activeHref="/contacto"
  ></app-aqua-header>

  <main class="contact-main" aria-label="Contacto AquaComunidad">
    <section class="contact-intro" aria-labelledby="contact-title">
      <h1 id="contact-title">
        Contacta con
        <span class="contact-highlight">
          AquaComunidad
          <svg viewBox="0 0 300 42" preserveAspectRatio="none" aria-hidden="true">
            <path d="M5 29C51 11 96 9 143 19c39 8 79 11 124 2 16-3 25-3 28 0" />
            <path d="M52 34c60-8 132-11 238-2" />
          </svg>
        </span>
      </h1>
      <p>Encuentra canales de atención para consultas, soporte y seguimiento de incidencias.</p>
    </section>

    <section class="contact-quick" aria-label="Información rápida de atención">
      <article
        *ngFor="let item of quickItems"
        class="contact-quick__item"
        [class.contact-quick__item--alert]="item.tone === 'alert'"
      >
        <span class="contact-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 7v5l3 2" />
            <path d="M20 12a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z" />
          </svg>
        </span>
        <div>
          <strong>{{ item.label }}</strong>
          <p>{{ item.value }}</p>
        </div>
      </article>
    </section>

    <section class="contact-shell" aria-label="Canales de contacto">
      <article
        *ngFor="let channel of channels"
        class="contact-card"
        [class.contact-card--whatsapp]="channel.tone === 'whatsapp'"
      >
        <header class="contact-card__head">
          <span class="contact-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M7 7h10v7H9l-3 3V8a1 1 0 0 1 1-1Z" />
            </svg>
          </span>
          <div>
            <span>{{ channel.title }}</span>
            <p>{{ channel.description }}</p>
          </div>
        </header>

        <div class="contact-card__body">
          <div>
            <h2>{{ channel.value }}</h2>
            <h3>Lo que puedes resolver:</h3>
            <ul>
              <li *ngFor="let item of channel.resolves">
                <i aria-hidden="true"></i>
                {{ item }}
              </li>
            </ul>
          </div>

          <a
            class="contact-action"
            [class.contact-action--whatsapp]="channel.tone === 'whatsapp'"
            [href]="channel.href"
            [attr.target]="channel.href.startsWith('https') ? '_blank' : null"
            rel="noopener noreferrer"
          >
            <svg *ngIf="channel.tone !== 'whatsapp'" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7.6 4.8 9.4 9c.2.5.1 1-.3 1.4l-1 1a12.4 12.4 0 0 0 4.5 4.5l1-1c.4-.4.9-.5 1.4-.3l4.2 1.8c.5.2.8.7.8 1.2v2.1c0 .7-.6 1.3-1.3 1.3A15.7 15.7 0 0 1 3 5.3C3 4.6 3.6 4 4.3 4h2.1c.5 0 1 .3 1.2.8Z" />
            </svg>
            <svg *ngIf="channel.tone === 'whatsapp'" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19.1 4.9A9.9 9.9 0 0 0 3.8 17.1L2.6 21.4l4.4-1.2a9.9 9.9 0 0 0 4.7 1.2h.1A9.9 9.9 0 0 0 19.1 4.9Zm-7.3 14.8h-.1a8.1 8.1 0 0 1-4.1-1.1l-.3-.2-2.6.7.7-2.5-.2-.3a8.1 8.1 0 1 1 6.6 3.4Zm4.4-6.1c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.6.1-.2.2-.7.8-.8 1-.1.2-.3.2-.5.1-.2-.1-1-.4-1.9-1.2-.7-.6-1.2-1.4-1.3-1.6-.1-.2 0-.4.1-.5l.4-.4c.1-.1.2-.3.3-.4.1-.2 0-.3 0-.5 0-.1-.6-1.4-.8-1.9-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.2-.9.9-.9 2.2 0 1.3.9 2.5 1.1 2.7.1.2 1.8 2.8 4.4 3.9.6.3 1.1.4 1.5.5.6.2 1.2.2 1.6.1.5-.1 1.4-.6 1.6-1.1.2-.5.2-1 .2-1.1-.1-.1-.3-.2-.5-.3Z" />
            </svg>
            {{ channel.action }}
          </a>
        </div>
      </article>
    </section>
  </main>

  <app-aqua-footer reportHref="/reportar" reportsHref="/mis-reportes" contactHref="/contacto"></app-aqua-footer>
  <app-aqua-mobile-nav activeHref="/contacto"></app-aqua-mobile-nav>
</div>
